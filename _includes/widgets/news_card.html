{% assign recent_news = site.news | sort: 'date' | reverse %}
<section class="news-section" id="news" aria-labelledby="news-title">
    <div class="section-heading"><h2 id="news-title">News</h2></div>
    {% for item in recent_news limit:include.limit %}
    <div class="news-item">
        <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b %Y' }}</time>
        <div>{{ item.title | markdownify }}</div>
    </div>
    {% endfor %}
</section>
