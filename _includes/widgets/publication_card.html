{% assign publications = include.publications %}
<section class="research-section" id="research" aria-labelledby="research-title">
    <div class="section-heading">
        <h2 id="research-title">{{ include.title | default: 'Selected Publications' }}</h2>
        <a class="section-link" href="{{ '/publications' | relative_url }}">View all <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </div>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item %}
    {% endfor %}
</section>
